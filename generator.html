<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore QR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>

  <style>
    body{
      font-family: Arial;
      padding:20px;
      text-align:center;
      background:#f5f5f5;
    }

    input, button{
      padding:10px;
      margin:5px;
    }

    canvas{
      margin-top:20px;
      max-width:100%;
      border:1px solid #ccc;
      background:white;
    }
  </style>
</head>
<body>

<h1>Generatore QR su Immagine</h1>

<input type="file" id="templateInput" accept="image/*"><br>

<input type="text" id="qrText" placeholder="Testo QR"><br>

<label>X</label>
<input type="number" id="qrX" value="100">

<label>Y</label>
<input type="number" id="qrY" value="100">

<label>Dimensione</label>
<input type="number" id="qrSize" value="200">

<br>

<button onclick="generateQRImage()">
  Genera
</button>

<button onclick="downloadPNG()">
  Scarica PNG
</button>

<br>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let templateImage = null;

document.getElementById("templateInput").addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    templateImage = new Image();

    templateImage.onload = function(){

      canvas.width = templateImage.width;
      canvas.height = templateImage.height;

      ctx.drawImage(templateImage, 0, 0);

    };

    templateImage.src = event.target.result;
  };

  reader.readAsDataURL(file);

});

async function generateQRImage(){

  if(!templateImage){
    alert("Carica un'immagine");
    return;
  }

  const qrText = document.getElementById("qrText").value;
  const qrX = parseInt(document.getElementById("qrX").value);
  const qrY = parseInt(document.getElementById("qrY").value);
  const qrSize = parseInt(document.getElementById("qrSize").value);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  ctx.drawImage(templateImage, 0, 0);

  const qrCanvas = document.createElement("canvas");

  await QRCode.toCanvas(qrCanvas, qrText, {
    width: qrSize,
    margin: 1
  });

  ctx.drawImage(qrCanvas, qrX, qrY);

}

function downloadPNG(){

  const link = document.createElement("a");

  link.download = "ticket.png";

  link.href = canvas.toDataURL("image/png");

  link.click();

}

</script>

</body>
</html>
