<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore QR</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    body{
      font-family: Arial, sans-serif;
      padding:20px;
      text-align:center;
      background:#f5f5f5;
    }

    input{
      padding:10px;
      margin:5px;
      width:250px;
    }

    button{
      padding:10px 20px;
      margin-top:10px;
      cursor:pointer;
    }

    canvas{
      margin-top:20px;
      max-width:100%;
      border:1px solid #ccc;
    }
  </style>
</head>
<body>

<h1>Generatore QR su Immagine</h1>

<input type="file" id="imageUpload" accept="image/*"><br>

<input type="text" id="userText" placeholder="Nome utente"><br>

<input type="number" id="posX" placeholder="Posizione X" value="100"><br>
<input type="number" id="posY" placeholder="Posizione Y" value="100"><br>

<input type="number" id="qrSize" placeholder="Dimensione QR" value="200"><br>

<button onclick="generate()">Genera</button>

<br>

<canvas id="canvas"></canvas>

<br>

<button onclick="downloadPNG()">Scarica PNG</button>

<script>

let uploadedImage = null;

document.getElementById('imageUpload').addEventListener('change', function(e){

  const file = e.target.files[0];

  if(!file) return;

  const reader = new FileReader();

  reader.onload = function(event){

    uploadedImage = new Image();

    uploadedImage.onload = function(){

      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      canvas.width = uploadedImage.width;
      canvas.height = uploadedImage.height;

      ctx.drawImage(uploadedImage, 0, 0);

    }

    uploadedImage.src = event.target.result;
  }

  reader.readAsDataURL(file);
});

function generate(){

  if(!uploadedImage){
    alert("Carica prima un'immagine");
    return;
  }

  const text = document.getElementById('userText').value;

  const x = parseInt(document.getElementById('posX').value);
  const y = parseInt(document.getElementById('posY').value);

  const size = parseInt(document.getElementById('qrSize').value);

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  canvas.width = uploadedImage.width;
  canvas.height = uploadedImage.height;

  ctx.drawImage(uploadedImage, 0, 0);

  const qrContainer = document.createElement("div");

  new QRCode(qrContainer, {
    text: text,
    width: size,
    height: size
  });

  const qrImage = qrContainer.querySelector("img");

  qrImage.onload = function(){

    ctx.drawImage(qrImage, x, y, size, size);

  }
}

function downloadPNG(){

  const canvas = document.getElementById('canvas');

  const link = document.createElement('a');

  link.download = 'ticket.png';

  link.href = canvas.toDataURL('image/png');

  link.click();
}

</script>

</body>
</html>
