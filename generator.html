<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generatore QR su Immagine</title>

  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
      background: #f5f5f5;
    }

    input, button {
      padding: 10px;
      margin: 6px;
      width: 260px;
    }

    canvas {
      margin-top: 20px;
      max-width: 100%;
      border: 1px solid #ccc;
      background: white;
    }
  </style>
</head>
<body>

<h1>Generatore QR su Immagine</h1>

<input type="file" id="imageUpload" accept="image/*"><br>

<input type="text" id="userText" placeholder="Codice / Utente da inserire nel QR"><br>

<input type="number" id="posX" value="100" placeholder="Posizione X"><br>
<input type="number" id="posY" value="100" placeholder="Posizione Y"><br>
<input type="number" id="qrSize" value="200" placeholder="Dimensione QR"><br>

<button onclick="generate()">Genera QR sull'immagine</button><br>
<button onclick="downloadPNG()">Scarica PNG</button>

<br>

<canvas id="canvas"></canvas>

<script>
let uploadedImage = null;

const imageUpload = document.getElementById("imageUpload");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

imageUpload.addEventListener("change", function(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(event) {
    uploadedImage = new Image();

    uploadedImage.onload = function() {
      canvas.width = uploadedImage.width;
      canvas.height = uploadedImage.height;
      ctx.drawImage(uploadedImage, 0, 0);
    };

    uploadedImage.src = event.target.result;
  };

  reader.readAsDataURL(file);
});

async function generate() {
  if (!uploadedImage) {
    alert("Carica prima un'immagine.");
    return;
  }

  const text = document.getElementById("userText").value.trim();
  const x = parseInt(document.getElementById("posX").value);
  const y = parseInt(document.getElementById("posY").value);
  const size = parseInt(document.getElementById("qrSize").value);

  if (!text) {
    alert("Inserisci il codice o il nome utente.");
    return;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(uploadedImage, 0, 0);

  const qrCanvas = document.createElement("canvas");

  await QRCode.toCanvas(qrCanvas, text, {
    width: size,
    margin: 1,
    color: {
      dark: "#000000",
      light: "#ffffff"
    }
  });

  ctx.drawImage(qrCanvas, x, y, size, size);
}

function downloadPNG() {
  const link = document.createElement("a");
  link.download = "ticket-qr.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}
</script>

</body>
</html>
