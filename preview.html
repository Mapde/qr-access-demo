<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Accessi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
      padding: 20px;
    }

    #reader {
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    button {
      padding: 14px 24px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .success {
      color: #00ff88;
      font-size: 24px;
      margin-top: 20px;
    }

    .error {
      color: #ff4444;
      font-size: 24px;
      margin-top: 20px;
    }

    .info {
      color: #ccc;
      margin-top: 15px;
    }
  </style>
</head>
<body>

<h1>Scanner Accessi</h1>

<button onclick="startScanner()">Avvia fotocamera</button>

<div id="reader"></div>

<div id="result"></div>

<script>
const validPasses = [
  { code: "OT1", name: "Emanuela Carboni", seat: "Fila A - Seduta 12" },
  { code: "VDM2", name: "Sara Carvone", seat: "Fila B - Posto 08" },
  { code: "MG3", name: "Gioele Deidda", seat: "Fila C - Posto 21" },
  { code: "LG4", name: "Giorgia Fiori", seat: "Fila C - Posto 21" },
  { code: "DL5", name: "Daniel Ghiani", seat: "Fila C - Posto 21" },
  { code: "IP6", name: "Anita Mandis", seat: "Fila C - Posto 21" },
  { code: "SMC7", name: "Yuri Marsilio", seat: "Fila C - Posto 21" },
  { code: "MR8", name: "Ivan Melis", seat: "Fila C - Posto 21" },
  { code: "LB9", name: "Gabriele Migliorelli", seat: "Fila C - Posto 21" },
  { code: "DA10", name: "Sophia Ortu", seat: "Fila C - Posto 21" },
  { code: "HCB11", name: "Julia Pani", seat: "Fila C - Posto 21" },
  { code: "UM12", name: "Zachary Pia", seat: "Fila C - Posto 21" },
  { code: "GBG13", name: "Andrea Torsani", seat: "Fila C - Posto 21" },
  { code: "FF14", name: "Eleonora Vacca", seat: "Fila C - Posto 21" }
];

let html5QrCode;

function onScanSuccess(decodedText) {
  const resultDiv = document.getElementById("result");

  const scannedCode = decodedText.trim();

  const found = validPasses.find(
    pass => pass.code === scannedCode
  );

  if (found) {
    resultDiv.innerHTML = `
      <div class="success">
        ✅ ACCESSO CONSENTITO<br><br>
        <strong>${found.name}</strong><br><br>
       
        <strong>${found.seat}</strong>
      </div>
    `;
  } else {
    resultDiv.innerHTML = `
      <div class="error">
        ❌ ACCESSO NEGATO<br><br>
        Codice letto: ${scannedCode}
      </div>
    `;
  }
}

function startScanner() {
  const resultDiv = document.getElementById("result");

  resultDiv.innerHTML = `<div class="info">Avvio fotocamera...</div>`;

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },
    onScanSuccess
  ).catch(err => {
    resultDiv.innerHTML = `
      <div class="error">
        Errore apertura fotocamera.<br><br>
        Controlla che il sito sia in HTTPS e aprilo da Safari.
      </div>
    `;
    console.error(err);
  });
}
</script>

</body>
</html>
