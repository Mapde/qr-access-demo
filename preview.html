<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Accessi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #263238, #080808);
      color: white;
      text-align: center;
      min-height: 100vh;
      padding: 24px;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 6px;
      font-size: 30px;
    }

    .subtitle {
      color: #b0b0b0;
      margin-bottom: 24px;
      font-size: 15px;
    }

    .scanner-card {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(12px);
    }

    #reader {
      width: 100%;
      min-height: 300px;
      overflow: hidden;
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.18);
      background: #000;
      position: relative;
    }

    #reader video {
      border-radius: 20px;
    }

    .scan-frame {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 230px;
      height: 230px;
      transform: translate(-50%, -50%);
      border: 3px solid #00ff88;
      border-radius: 18px;
      pointer-events: none;
      box-shadow: 0 0 0 999px rgba(0,0,0,0.35);
      z-index: 10;
    }

    .scan-line {
      position: absolute;
      left: 16px;
      right: 16px;
      top: 20px;
      height: 3px;
      background: #00ff88;
      border-radius: 20px;
      animation: scanMove 2s infinite ease-in-out;
      box-shadow: 0 0 14px #00ff88;
    }

    @keyframes scanMove {
      0% { top: 20px; }
      50% { top: 205px; }
      100% { top: 20px; }
    }

    button {
      width: 100%;
      padding: 16px 24px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 16px;
      cursor: pointer;
      margin-bottom: 18px;
      color: #06140d;
      background: linear-gradient(135deg, #00ff88, #9cffc9);
      box-shadow: 0 10px 30px rgba(0,255,136,0.25);
    }

    .result-card {
      margin-top: 22px;
      border-radius: 22px;
      padding: 24px;
      background: rgba(255,255,255,0.09);
      border: 1px solid rgba(255,255,255,0.14);
      min-height: 90px;
    }

    .success {
      color: #00ff88;
      font-size: 24px;
      font-weight: bold;
    }

    .error {
      color: #ff5a5a;
      font-size: 24px;
      font-weight: bold;
    }

    .name {
      display: block;
      color: white;
      font-size: 28px;
      margin-top: 14px;
    }

    .seat {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(0,255,136,0.14);
      color: #d9ffeb;
      font-size: 20px;
    }

    .info {
      color: #ccc;
      font-size: 16px;
    }

    .small {
      display: block;
      margin-top: 10px;
      color: #aaa;
      font-size: 13px;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Scanner Accessi</h1>
  <div class="subtitle">Inquadra il QR code del biglietto</div>

  <audio id="scanSound" src="beep.mp3" preload="auto" playsinline></audio>

  <div class="scanner-card">
    <button onclick="startScanner()">Avvia fotocamera</button>

    <div id="reader">
      <div class="scan-frame">
        <div class="scan-line"></div>
      </div>
    </div>
  </div>

  <div id="result" class="result-card">
    <div class="info">Premi “Avvia fotocamera” per iniziare</div>
  </div>

</div>

<script>
const validPasses = [
  { code: "OT1", name: "Emanuela Carboni", seat: "Fila A - Posto 13" },
  { code: "VDM2", name: "Sara Carvone", seat: "Fila B - Posto 13" },
  { code: "MG3", name: "Gioele Deidda", seat: "Fila C - Posto 22" },
  { code: "LG4", name: "Giorgia Fiori", seat: "Fila F - Posto 21" },
  { code: "DL5", name: "Daniel Ghiani", seat: "Fila E - Posto 22" },
  { code: "IP6", name: "Anita Mandis", seat: "Fila C - Posto 16" },
  { code: "SMC7", name: "Yuri Marsilio", seat: "Fila D - Posto 11" },
  { code: "MR8", name: "Ivan Melis", seat: "Fila A - Posto 12" },
  { code: "LB9", name: "Gabriele Migliorelli", seat: "Fila B - Posto 4" },
  { code: "DA10", name: "Sophia Ortu", seat: "Fila B - Posto 21" },
  { code: "HCB11", name: "Julia Pani", seat: "Fila D - Posto 20" },
  { code: "UM12", name: "Zachary Pia", seat: "Fila E - Posto 6" },
  { code: "GBG13", name: "Andrea Torsani", seat: "Fila F - Posto 8" },
  { code: "FF14", name: "Eleonora Vacca", seat: "Fila A - Posto 14" }
  { code: "FIGA", name: "Fabrizio Giuliani", seat: "Fila VIP - Posto Fisso" }
];

let html5QrCode;
let lastScannedCode = "";
let lastScanTime = 0;
let audioUnlocked = false;

function unlockAudio() {
  const sound = document.getElementById("scanSound");

  sound.volume = 1;

  sound.play()
    .then(() => {
      sound.pause();
      sound.currentTime = 0;
      audioUnlocked = true;
    })
    .catch(() => {
      audioUnlocked = false;
    });
}

function playSound() {
  const sound = document.getElementById("scanSound");

  if (!audioUnlocked) {
    return;
  }

  sound.currentTime = 0;
  sound.play().catch(() => {});
}

function onScanSuccess(decodedText) {
  const scannedCode = decodedText.trim();
  const now = Date.now();

  if (scannedCode === lastScannedCode && now - lastScanTime < 2500) {
    return;
  }

  lastScannedCode = scannedCode;
  lastScanTime = now;

  playSound();

  const resultDiv = document.getElementById("result");

  const found = validPasses.find(
    pass => pass.code === scannedCode
  );

  if (found) {
    resultDiv.innerHTML = `
      <div class="success">
        ✅ ACCESSO CONSENTITO
        <span class="name">${found.name}</span>
        <span class="seat">${found.seat}</span>
      </div>
    `;
  } else {
    resultDiv.innerHTML = `
      <div class="error">
        ❌ ACCESSO NEGATO
        <span class="small">Codice letto: ${scannedCode}</span>
      </div>
    `;
  }
}

function startScanner() {
  const resultDiv = document.getElementById("result");

  unlockAudio();

  resultDiv.innerHTML = `<div class="info">Avvio fotocamera...</div>`;

  if (html5QrCode) {
    resultDiv.innerHTML = `<div class="info">Fotocamera già attiva. Inquadra il QR code.</div>`;
    return;
  }

  html5QrCode = new Html5Qrcode("reader");

  html5QrCode.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 230
    },
    onScanSuccess
  ).then(() => {
    resultDiv.innerHTML = `<div class="info">Fotocamera attiva. Inquadra il QR code.</div>`;
  }).catch(err => {
    resultDiv.innerHTML = `
      <div class="error">
        Errore apertura fotocamera.
        <span class="small">Controlla HTTPS, Safari e permessi fotocamera.</span>
      </div>
    `;
    console.error(err);
  });
}
</script>

</body>
</html>
